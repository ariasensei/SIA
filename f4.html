<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIA | Admin Accounts & Roles</title><style>
:root{--bg:#071429;--card:#102543;--edge:#2d537b;--cyan:#5eead4;--text:#f4f8ff;--muted:#b9cce2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.slide{display:none;min-height:100vh;padding:6vh 7vw 13vh;align-items:center;justify-content:center}.slide.active{display:flex}.inner{width:min(1200px,100%)}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(13px,1.3vw,18px)}h1{font-size:clamp(42px,5.4vw,78px);line-height:1.09;margin:.2em 0 .45em}h2{font-size:clamp(34px,4.4vw,62px);line-height:1.13;margin:.2em 0 .5em}.items{display:grid;gap:13px}.item{background:linear-gradient(110deg,#102b4c,#0d213c);border:1px solid var(--edge);border-radius:17px;padding:15px 22px;font-size:clamp(18px,2.05vw,29px);line-height:1.36}.item:before{content:'✦';color:var(--cyan);margin-right:12px}.lead{font-size:clamp(23px,2.7vw,37px);color:var(--muted);line-height:1.5}.nav{position:fixed;bottom:0;left:0;right:0;padding:13px 4vw;background:#061020ee;border-top:1px solid #294768;display:flex;align-items:center;justify-content:space-between;gap:15px}.nav button{background:#153d64;color:white;border:1px solid #4381a6;border-radius:10px;padding:10px 20px;font-size:17px;cursor:pointer}.nav button:hover{background:#21628c}.counter{color:var(--muted);font-weight:700}.bar{position:fixed;top:0;left:0;height:5px;background:var(--cyan);transition:width .2s}.mock{background:#09192f;border:1px solid #34577a;border-radius:18px;overflow:hidden;box-shadow:0 22px 55px #0006;margin-top:18px}.mockhead{padding:15px 22px;background:#15365a;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:20px}.mockbody{display:grid;grid-template-columns:210px 1fr;min-height:390px}.sidebar{padding:22px 12px;background:#0c2039;border-right:1px solid #294866}.sideitem{padding:12px 14px;margin-bottom:7px;border-radius:9px;color:#c6d8eb;font-size:18px}.sideitem:first-child{background:#1b5570;color:white}.content{padding:25px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat{background:#15365b;border:1px solid #34577a;border-radius:12px;padding:17px}.stat b{display:block;color:var(--cyan);font-size:32px;margin-top:7px}.fakechart{display:flex;align-items:end;gap:13px;height:135px;border-bottom:1px solid #52718e;padding:10px 8px;margin:20px 0}.fakechart i{display:block;flex:1;background:linear-gradient(#5eead4,#2c6aab);border-radius:6px 6px 0 0}.minitable{width:100%;border-collapse:collapse;font-size:17px}.minitable th,.minitable td{padding:11px;text-align:left;border-bottom:1px solid #284765}.pill{color:#6ee7b7}.matrix{width:100%;border-collapse:collapse;background:#102543;font-size:clamp(14px,1.55vw,22px)}.matrix th,.matrix td{padding:18px 12px;border:1px solid #34577a;text-align:center}.matrix th:first-child,.matrix td:first-child{text-align:left}.yes{color:#5eead4;font-weight:900}.no{color:#ef9aa7}.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin:35px 0}.node{background:#153b61;border:1px solid #5c92b4;border-radius:14px;padding:22px;font-size:clamp(17px,2vw,27px);font-weight:800}.arrow{color:var(--cyan);font-size:32px}.note{color:#b9cce2;font-size:19px;margin-top:20px}.badge{display:inline-block;background:#134b50;color:#99f6e4;padding:7px 13px;border-radius:50px;font-weight:800;margin-bottom:10px}@media(max-width:720px){.slide{padding:8vh 5vw 15vh}.mockbody{grid-template-columns:115px 1fr}.sidebar{padding:12px 5px}.sideitem{font-size:12px;padding:8px}.content{padding:10px}.stat{padding:8px}.stat b{font-size:18px}.stats{gap:5px}.minitable{font-size:11px}.minitable th,.minitable td{padding:6px}.mockhead{font-size:14px}.matrix th,.matrix td{padding:7px 3px}.item{padding:12px}.node{padding:10px}}
</style></head><body><div class="bar" id="bar"></div><main id="deck"></main><div class="nav"><button onclick="move(-1)">← Previous</button><span class="counter" id="counter"></span><button onclick="move(1)">Next →</button><button onclick="document.documentElement.requestFullscreen?.()">⛶</button></div><script>
const slides=[["Admin Accounts & User Roles", "System Integration and Architecture \u2022 Game Development|From a player-only dashboard to a managed game platform"], ["Learning Outcomes", "Explain why an admin account matters|Distinguish authentication from authorization|Identify player, moderator, admin, and developer permissions|Visualize how dashboards, APIs, and databases integrate"], ["A Message About Your Final Project", "For your final project, I only required a dashboard for the USER account.|I intentionally did not include a full ADMIN account in the required scope.|Many of you work on this project during our class time while completing other course requirements.|A proper admin module would require extra interface design, backend logic, security checks, and testing.|You are NOT required to add it to your current final submission unless separately instructed."], ["Why Discuss Admin Accounts Then?", "Our goal is to understand how a real-world integrated game system grows.|A player-facing application is one part of the platform.|Behind the scenes, authorized staff manage users, games, reports, and platform health.|Knowing the architecture now prepares you for future development."], ["Player vs. Administrator", "PLAYER: plays games, views progress, checks leaderboard, edits own profile.|ADMIN: oversees the platform, manages accounts and game catalog, reviews activity, handles operational issues.|Different responsibilities require different permissions."], ["Authentication vs. Authorization", "Authentication asks: Who are you? Example: log in with email and password.|Authorization asks: What are you allowed to do? Example: only admins can disable accounts.|A successful login does NOT automatically grant admin privileges."], ["Common Roles in a Game Platform", "Player \u2014 play games and manage own data|Moderator \u2014 review player reports and moderate content|Game Manager \u2014 manage game catalog and announcements|Administrator \u2014 manage users, settings, and operational reports|Developer / Support \u2014 diagnose technical issues using limited approved access"], ["Role-Based Access Control (RBAC)", "RBAC assigns permissions to roles rather than manually assigning every permission to every user.|One person can have one or multiple roles depending on system policy.|Always enforce permissions on the SERVER, not just by hiding menu items."], ["Example Permission Matrix", "See the interactive matrix on the next slide.|Principle: least privilege \u2014 grant only the access needed to perform a job."], ["Visual Example: Player Dashboard", "Player dashboard includes game library, level, coins, recent scores, and leaderboard.|A player should only see their own private account data."], ["Visual Example: Admin Dashboard", "Admin dashboard can show total users, active games, flagged reports, and system events.|Navigation: Overview, Users, Games, Reports, Analytics, Audit Logs, Settings.|Metrics shown are illustrative, not live data."], ["Visual Example: Moderator Dashboard", "Moderator dashboard prioritizes reported users, content flags, case notes, and resolution history.|Moderators should not automatically have access to server settings or account passwords."], ["Visual Example: Game Manager Dashboard", "Game manager dashboard supports game catalog entries, release status, featured titles, and announcements.|Publishing changes should be tracked and may require approval."], ["How the Parts Integrate", "Browser or game client \u2192 authenticated API \u2192 authorization middleware \u2192 application services \u2192 database.|Player actions save scores and progress.|Admin actions update approved records and write audit events.|The same backend can serve different role-specific dashboards."], ["Example Database Design", "users(id, username, email, password_hash, status)|roles(id, name)|user_roles(user_id, role_id)|games(id, title, status)|scores(id, user_id, game_id, score)|audit_logs(id, actor_id, action, target_id, created_at)|Store hashed passwords, never plaintext passwords."], ["Sample Admin Features", "User Management \u2014 search, suspend, restore accounts|Game Management \u2014 add, update, publish, archive games|Reports \u2014 review player complaints and resolve cases|Analytics \u2014 monitor usage and engagement|Audit Logs \u2014 record important administrative changes|Settings \u2014 manage controlled platform configuration"], ["Example: Suspending an Account", "1. Admin signs in with authorized credentials.|2. Backend verifies the admin permission.|3. Admin selects a user and provides a reason.|4. Backend updates the account status in a transaction.|5. Audit log records who did what and when.|6. A suspended user is blocked according to policy."], ["Security Rules That Matter", "Never trust a role supplied by the browser.|Check access on every protected API endpoint.|Use password hashing, HTTPS, secure sessions, and CSRF protection where applicable.|Validate inputs and use prepared SQL statements.|Keep audit logs and protect sensitive personal information.|Use least privilege and consider MFA for administrators."], ["Common Mistakes", "Hiding the Admin button is NOT security.|A player must not become admin by editing a URL or request.|Do not store passwords as plain text or expose password hashes in dashboards.|Do not allow any logged-in user to call admin APIs.|Do not overwrite audit history without controls."], ["What Is Required in Your Final Project?", "REQUIRED: player login and registration, player dashboard, game launch, saved score/progress, leaderboard, and the integration described in your project instructions.|NOT REQUIRED: complete admin dashboard, moderator console, multi-role permission editor, or advanced operational analytics.|OPTIONAL FOR LEARNING: design a future admin dashboard mockup or explain how RBAC would fit your architecture.|Follow your official final-project rubric for grading."], ["Discussion: Think Like a System Architect", "What could go wrong if a player could edit another player\u2019s score?|Who should be allowed to publish a new game?|Should moderators be able to delete users permanently?|How would you prove who changed a player\u2019s account status?"], ["Key Takeaways", "A player dashboard serves players; an admin dashboard operates the platform.|Authentication identifies a user; authorization limits their actions.|RBAC and server-side checks protect shared resources.|Admin features are important for a production system but outside our current required final-project scope."], ["Thank You!", "System Integration and Architecture \u2022 Game Development|Build the player experience first. Understand the larger architecture for what comes next."]];
const mockups={9:{name:'PLAYER PORTAL',menu:['Overview','My Games','My Progress','Leaderboard','Profile'],stats:[['My Level','08'],['Coins','1,250'],['Best Score','9,800']],columns:['Game','Status','Progress'],rows:[['Sky Runner','Playable','Level 8'],['Pixel Quest','Playable','Level 3']]},10:{name:'ADMIN CONTROL CENTER',menu:['Overview','Users','Games','Reports','Analytics','Audit Logs','Settings'],stats:[['Registered Users','1,248'],['Published Games','12'],['Open Reports','07']],columns:['Recent action','Module','Status'],rows:[['Account review','Users','Pending'],['New game release','Games','Published']]},11:{name:'MODERATION DESK',menu:['Queue','Player Reports','Cases','Actions','History'],stats:[['Open Cases','18'],['Reviewed Today','09'],['Escalations','02']],columns:['Case','Reason','Status'],rows:[['#1042','Abusive chat','Review'],['#1043','Cheating report','Escalated']]},12:{name:'GAME CATALOG MANAGER',menu:['Overview','Game Library','Releases','Announcements','History'],stats:[['Published','12'],['Drafts','04'],['Scheduled','02']],columns:['Game','Version','Status'],rows:[['Sky Runner','v1.2','Published'],['Pixel Quest','v0.9','Draft']]}};
function mock(m){return `<div class="mock"><div class="mockhead"><span>◈ ${m.name}</span><span>Demo interface • Sample data</span></div><div class="mockbody"><div class="sidebar">${m.menu.map(x=>`<div class="sideitem">${x}</div>`).join('')}</div><div class="content"><div class="stats">${m.stats.map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('')}</div><div class="fakechart">${[37,58,46,77,62,91,73,84].map(n=>`<i style="height:${n}%"></i>`).join('')}</div><table class="minitable"><thead><tr>${m.columns.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${m.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></div>`}
const matrix=[['View own scores','✓','—','—','✓'],['Review player reports','—','✓','—','✓'],['Publish games','—','—','✓','✓'],['Manage user status','—','—','—','✓'],['View audit logs','—','Limited','Limited','✓']];
function render(){document.getElementById('deck').innerHTML=slides.map((s,i)=>{let special='';if(mockups[i])special=mock(mockups[i]);if(i===8)special=`<table class="matrix"><tr><th>Permission</th><th>Player</th><th>Moderator</th><th>Game Manager</th><th>Admin</th></tr>${matrix.map(r=>`<tr>${r.map((c,j)=>`<td class="${c==='✓'?'yes':c==='—'?'no':''}">${c}</td>`).join('')}</tr>`).join('')}</table><div class="note">Illustrative policy: exact permissions depend on your system requirements.</div>`;if(i===13)special=`<div class="flow">${['Game Client / Browser','Authenticated API','RBAC Middleware','Services','Database + Audit Log'].map((n,j)=>`${j?'<span class="arrow">→</span>':''}<div class="node">${n}</div>`).join('')}</div>`;return `<section class="slide" id="s${i}"><div class="inner"><div class="eyebrow">SIA • Game Development • Lesson ${i+1}</div>${i===0?`<h1>${s[0]}</h1>`:`<h2>${s[0]}</h2>`}${special|| (i===0||i===22?`<div class="lead">${s[1].split('|').join('<br>')}</div>`:`<div class="items">${s[1].split('|').map(x=>`<div class="item">${x}</div>`).join('')}</div>`)}</div></section>`}).join('');show()}
let current=0;function show(){document.querySelectorAll('.slide').forEach((x,i)=>x.classList.toggle('active',i===current));document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;document.getElementById('bar').style.width=`${(current+1)/slides.length*100}%`}function move(n){current=Math.max(0,Math.min(slides.length-1,current+n));show()}document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}});render();
</script></body></html>
